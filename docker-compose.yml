services:
  app:
    image: lms-inspira:latest
    container_name: lms-inspira
    restart: unless-stopped
    ports:
      # Hanya expose ke localhost — Nginx yang handle traffic publik
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    volumes:
      # Persistent volume untuk file uploads (survive container restart)
      - uploads_data:/app/server/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/api/health', (r) => { if(r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads_data:
    driver: local
