# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy config untuk LMS Inspira di Biznet GIO Cloud
# Ganti DOMAIN_PLACEHOLDER dengan domain asli Anda sebelum deploy.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (defined at http level via /etc/nginx/nginx.conf include)
# Jika Anda paste ini langsung ke nginx.conf utama, pindahkan limit_req_zone
# ke dalam blok http {} di luar server {}.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=10r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Certbot ACME challenge (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    # ── SSL certificates (Let's Encrypt via Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/chain.pem;

    # ── SSL hardening ──
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            SAMEORIGIN always;
    add_header X-Content-Type-Options     nosniff always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # ── Upload size — sesuai limit multer (5MB) + overhead ──
    client_max_body_size 10M;

    # ── Gzip compression ──
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Proxy shared settings ──
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # ── Auth endpoints — strict rate limit ──
    location /api/auth {
        limit_req zone=api_auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 30s;
    }

    # ── Upload endpoints — rate limit upload ──
    location /api/uploads {
        limit_req zone=api_upload burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 60s;
        # Allow larger body here as well (redundant but explicit)
        client_max_body_size 10M;
    }

    # ── General API ──
    location /api {
        limit_req zone=api_general burst=100 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 60s;
    }

    # ── Static uploaded files (images/PDFs) — agressive caching ──
    location /uploads {
        proxy_pass          http://127.0.0.1:8080;
        proxy_read_timeout  30s;

        # Cache uploaded assets di browser selama 1 hari
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # ── SPA fallback — semua route lain ke Express (yang serve client/dist) ──
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 30s;

        # Cache HTML sebentar saja (SPA)
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    # ── Block akses ke file sensitif ──
    location ~ /\. {
        deny all;
        return 404;
    }
}
